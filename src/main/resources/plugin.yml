main: net.tfminecraft.gunsandgadgets.GunsAndGadgets
api-version: '1.21.10'
name: GunsAndGadgets
version: ${project.version}
author: Drefvelin

depend: [TLibs, MythicLib, MMOItems, MMOCore]
softdepend: [VehicleFramework]

commands:
  gg:
    description: GunsAndGadgets admin commands
    usage: /<command> reload|refresh|give

permissions:
  gunsandgadgets.reload:
    description: Reload GunsAndGadgets configs (skins, parts, metals, ammunition, config)
    default: op
  gunsandgadgets.give:
    description: Give completed guns (default give-permission)
    default: op
