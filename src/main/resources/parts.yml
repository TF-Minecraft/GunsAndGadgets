# Gun parts. A part with 'tendencies' is forged: it becomes one part per material in
# metals.yml (id <part>@<material>), and the material scales its tendencies, which are
# written for steel (stocks: maplewood). 'fixed' stats never scale; 'by-metal' adds per
# material; an 'ammo-family' barrel loads that family's shot up to its material's tier;
# 'ammo-filter' (powered/plain) limits the gun's shot; 'skin-base' borrows a gun design.
# Use disabled: true to retire a part from new crafts (do not delete ids).

