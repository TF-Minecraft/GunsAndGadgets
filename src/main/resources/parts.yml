  part-type: action
  tier: 4
  type:
    - rifle
  item: modeled.(type=gunpowder;model=14)
  sounds:
    - reload gunsandgadgets:arclock_reload
    - reload minecraft:block.beacon.activate
  sound-overrides:
    - shoot minecraft:guns.musket_1,minecraft:guns.musket_3,minecraft:guns.musket_7,minecraft:guns.musket_8,minecraft:guns.musket_9 
  stats:
    - fire_rate -12
    - accuracy 8
    - reload -10
    - speed 8
  caliber-override:
    - bronzeshot
  name-impact:
    - §5Arclock 0 10
  skin-impact:
    - arclock 10
  cost:
    - m.materials.mythril_ingot(2)
  permissions:
    - professions.mythril_smith
  class:
    - Musketeer
  lore:
    - "§7Unlike the arclocks used in larger weapons like mounted heavy rifles"
    - "§7The experimental handheld arclocks are not able to reproduce the rapid"
    - "§7rate of fire seen in these larger guns. Instead the focus is shifted to"
    - "§7accuracy and speed at great cost of its manual and long reloading process."

