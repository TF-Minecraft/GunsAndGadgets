# Permission required to spawn completed weapons; blank disables the command.
give-permission: gunsandgadgets.give

output-slot: 16

outputs:
    rifle: m.guns.rifle_template
    pistol: m.guns.pistol_template
    shotgun: m.guns.shotgun_template
    launcher: m.guns.launcher_template

station: iaf(tfmc:gunsmithing_station)

block-damage: false
rocket-sound: minecraft:block.lava.extinguish

stat_refresh_debug: false

# Shot handling. Leaving a key out keeps the behaviour from before this section
# existed (headshot 1.5, every spread multiplier 1, no falloff).
handling:
    # Damage multiplier for hits in the top quarter of a player's hitbox.
    headshot-multiplier: 1.25
    # Spread multiplier for the shooter's stance when the shot fires. Riding an
    # animal or sitting in a moving vehicle (boat, minecart, VehicleFramework
    # vehicle with speed) uses mounted; a seat that isn't moving (chairs, parked
    # vehicles) counts as still. Otherwise airborne beats sprinting, sprinting
    # beats moving, and sneaking scales the ground value (still or moving).
    spread-multipliers:
        sneaking: 0.8
        moving: 2.0
        sprinting: 4.0
        airborne: 5.0
        mounted: 2.0
    # Upper limit for the final spread in degrees.
    max-spread-degrees: 45
    # Bullets do full damage up to start-distance blocks from the muzzle, then
    # drop linearly to min-multiplier at the shot's maximum range. Rockets and
    # vehicle hits are not affected. min-multiplier 1 turns falloff off.
    falloff:
        start-distance: 24
        min-multiplier: 0.5

attributes:
    charisma:
        accuracy-per-level: 1.0
        reload-reduction-per-level: 1.0

required-parts:
    rifle:
        - barrel
        - loader
        - chamber
        - action
        - stock
    pistol:
        - barrel
        - loader
        - chamber
        - action
    shotgun:
        - barrel
        - loader
        - chamber
        - action
        - stock
    launcher:
        - barrel
        - loader
        - chamber
        - action
