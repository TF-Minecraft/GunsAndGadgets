# Permission required to spawn completed guns; blank disables the command.
give-permission: gunsandgadgets.give

output-slot: 16

outputs:
    rifle: m.guns.rifle_template
    pistol: m.guns.pistol_template
    shotgun: m.guns.shotgun_template
    launcher: m.guns.launcher_template

station: iaf(tfmc:gunsmithing_station)

block-damage: false
rocket-sound: minecraft:block.lava.extinguish

stat_refresh_debug: false

# Shot handling. Leaving a key out keeps the behaviour from before this section
# existed (headshot 1.5, every spread multiplier 1, no spread cap, no falloff).
handling:
    # Damage multiplier for hits in the top quarter of a player's hitbox.
    headshot-multiplier: 1.25
    # Spread multiplier for the shooter's stance when the shot fires (the
    # launch cone only; rocket wobble in flight is unchanged).
    # - Seats: a VehicleFramework vehicle with speed, a moving minecart, a boat
    #   whose driver holds forward or back, or any animal uses mounted; a seat
    #   that isn't moving (chairs, parked vehicles) counts as still.
    # - On foot (including standing on a vehicle's deck): airborne beats
    #   sprinting (swimming fast counts as sprinting), sprinting beats moving,
    #   and sneaking scales the ground value (still or moving).
    spread-multipliers:
        sneaking: 0.8
        moving: 2.0
        sprinting: 4.0
        airborne: 5.0
        mounted: 2.0
        # Shots fired without aiming (crouch to aim), only while aiming is enabled.
        hip: 1.75
    # Upper limit for the final spread in degrees (no limit if left out).
    max-spread-degrees: 45
    # Bullets do full damage up to start-distance blocks from the muzzle, then
    # drop linearly to min-multiplier at the shot's maximum range. Rockets and
    # vehicle hits are not affected. min-multiplier 1 turns falloff off.
    falloff:
        start-distance: 24
        min-multiplier: 0.5
    # Rocket blasts hurt others by the distance the rocket flew: min-multiplier up to
    # safe-distance (a rocket fired at the ground at your feet barely hurts anyone else),
    # rising to full damage at full-damage-distance. The shooter always takes their own blast
    # in full. Left out (or full-damage-distance 0), blasts arm over the first second of flight.
    rockets:
        safe-distance: 4
        min-multiplier: 0.1
        full-damage-distance: 40
    # Accuracy above 5 tightens spread by 5% a point. Off (or left out), spread
    # follows the old line that reaches 1.2 degrees at 20 and 0.07 at 30.
    smooth-accuracy: true
    # A shotgun barrel's spread stat is its pellet cone in degrees: the aim wanders
    # by accuracy and stance, then the pellets fan out around it. Each point of
    # accuracy tightens the cone, down to min-factor of its size.
    pellet-cone:
        tighten-per-accuracy: 0.03
        min-factor: 0.4
    # Draw time: a gun taken into the hand can't fire or reload until it is drawn
    # (the hotbar shows a cooldown sweep). Seconds per gun type; a part's draw stat
    # makes it quicker (positive) or slower, within half to double. While drawing,
    # the stance stretches the time: moving, sprinting, airborne (jumping, falling)
    # and riding a moving seat; crouching can shorten it. Leave the section out for
    # no draw time.
    draw:
        base-seconds:
            pistol: 0.6
            shotgun: 1.0
            rifle: 1.3
            launcher: 2.0
        stance:
            moving: 1.4
            sprinting: 2.0
            airborne: 2.0
            mounted: 1.5
            sneaking: 0.8

# Crouch with a loaded, drawn gun to aim it: the gun shows its sights-up pose and
# the player walks slower, which narrows the field of view (the zoom; players who
# turned FOV effects off only get the slowdown). slow is the share of walking speed
# taken away (0 to 0.9). A scoped gun (the arclock) aims like any gun; while aimed,
# hold right-click to look through the scope (the gun becomes a spyglass while it is
# held) and release once it is steady to fire. scope-settle-seconds is how long the
# scope must be up first; an earlier release lowers it without a shot. The swap-hands key with a gun in hand picks the next shot.
# Shots fired without aiming spread wider: handling.spread-multipliers.hip.
aiming:
    enabled: true
    slow: 0.5
    scope-settle-seconds: 0.6

# Guns stamped with a disabled (retired) part refuse to fire or reload. Nothing
# is written to the gun, so turning this off makes them usable again.
retire-disabled-part-guns: false

# Old guns are taken apart so none stay on the server: built with a part from retired-parts.yml
# or a removed part, or from before guns recorded their parts (2.0.0). A part only disabled in
# parts.yml leaves its guns alone. The gun is removed and the player gets what its crafting took
# (recorded since 2.0.6), or for older stamped guns the costs of their parts, plus any loaded shots.
# Guns with no price (crafted for free, unstamped, a removed part) give nothing back. Guns with a
# removed part wait while parts.yml or retired-parts.yml fails to load, and a missing forged part
# (a material removed from metals.yml) never counts.
# Right-clicking the gun station with one does it; automatic also does it on join, on selecting
# it in the hotbar or clicking it in the player's own inventory. Guns in chests wait until
# someone takes them.
refunds:
    enabled: false
    automatic: false

# Item model prefix for forged part icons in the gunsmithing menus: <prefix><part> in the part
# list, <prefix><part>_<material> once a material is chosen (the pack's tfmc_guns icons).
# Leave blank to show each part's own item.
part-icons: "tfmc_guns:part/"

# Item model prefix for the gun type buttons in the gunsmith: <prefix><type>_carry, drawn
# as a steel gun of that type. Leave blank for paper.
type-icons: "tfmc_guns:"

attributes:
    charisma:
        accuracy-per-level: 1.0
        reload-reduction-per-level: 1.0

required-parts:
    rifle:
        - barrel
        - loader
        - chamber
        - action
        - stock
    pistol:
        - barrel
        - loader
        - chamber
        - action
        - stock
    shotgun:
        - barrel
        - loader
        - chamber
        - action
        - stock
    launcher:
        - barrel
        - loader
        - chamber
        - action
